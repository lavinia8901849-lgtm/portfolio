const h = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

const validUrl = url => { try { const u = new URL(url, location.href); return ['http:','https:'].includes(u.protocol) ? u.href : '#/portfolio'; } catch { return '#/portfolio'; } };
const sessionKey = 'lavinia-supabase-session';
let session = JSON.parse(localStorage.getItem(sessionKey) || 'null');

async function api(table, { method='GET', query='', body, auth=false }={}) {
  if (!configured) throw new Error('Configure o Supabase em assets/config.js.');
  const headers = {
    apikey: CONFIG.supabaseAnonKey,
    Authorization: `Bearer ${auth && session?.access_token ? session.access_token : CONFIG.supabaseAnonKey}`,
    'Content-Type': 'application/json',
    'Accept-Profile': 'public',
    'Content-Profile': 'public'
  };
  if (method !== 'GET') headers.Prefer = 'return=representation';
  const response = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${table}${query}`, {method, headers, body: body===undefined ? undefined : JSON.stringify(body)});
  if (!response.ok) { const data = await response.json().catch(()=>({})); throw new Error(data.message || data.error_description || data.hint || `Erro ${response.status} ao acessar ${table}`); }
  const text = await response.text(); return text ? JSON.parse(text) : [];
}
async function login(email,password) {
  const response = await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`, { method:'POST', headers:{apikey:CONFIG.supabaseAnonKey,'Content-Type':'application/json'}, body:JSON.stringify({email,password}) });
  const data = await response.json(); if (!response.ok) throw new Error(data.error_description || data.msg || 'Não foi possível entrar.');
  session = data; localStorage.setItem(sessionKey,JSON.stringify(data)); return data;
}
async function currentUser() {
  if (!session?.access_token || !configured) return null;
  let res = await fetch(`${CONFIG.supabaseUrl}/auth/v1/user`, {headers:{apikey:CONFIG.supabaseAnonKey,Authorization:`Bearer ${session.access_token}`}});
  if (res.status === 401 && session.refresh_token) {
    const refresh = await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {method:'POST',headers:{apikey:CONFIG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(refresh.ok){session=await refresh.json();localStorage.setItem(sessionKey,JSON.stringify(session));res=await fetch(`${CONFIG.supabaseUrl}/auth/v1/user`,{headers:{apikey:CONFIG.supabaseAnonKey,Authorization:`Bearer ${session.access_token}`}})}
  }
  if (!res.ok) { session=null; localStorage.removeItem(sessionKey); return null; }
  return res.json();
}

async function portfolio(){
  const fallbackProjects=[
    {titulo:'Kitty Sweet Café — Sistema de Restaurante',descricao:'Sistema completo de restaurante desenvolvido em PHP e MySQL, com cardápio dinâmico, carrinho de compras, login de usuários, cadastro de produtos e dashboard administrativo.',link:'#',imagem:''},
    {titulo:'Site da Empresa de TI',descricao:'Site institucional desenvolvido durante o primeiro trimestre, apresentando uma empresa de tecnologia, seus serviços, informações e contato.',link:'#',imagem:''},
    {titulo:'Carlos Chagas — História, Cultura e Desenvolvimento',descricao:'Projeto em grupo sobre Carlos Chagas (MG), abordando a história da cidade, sua relevância, cultura, natureza e a relação com a agropecuária e a exportação de gado para a China.',link:'#',imagem:''}
  ];

  main.innerHTML=header('PORTFÓLIO','Meus projetos.','Projetos carregados do banco de dados Supabase.')+
    '<div id="projects" class="projects"><div class="empty"><span>✦</span><h2>Carregando projetos...</h2><p>Aguarde um instante.</p></div></div>'+
    '<p id="projects-status" role="status"></p>';

  const area=document.querySelector('#projects');
  const status=document.querySelector('#projects-status');

  const renderProjects=(rows)=>{
    area.innerHTML=rows.map(p=>{
      const image=p.imagem?`<img class="project-image" src="${h(p.imagem)}" alt="Imagem do projeto ${h(p.titulo)}" loading="lazy">`:'';
      const link=p.link&&p.link!=='#'?`<a class="button" href="${h(validUrl(p.link))}" target="_blank" rel="noopener noreferrer">Abrir projeto ↗</a>`:'';
      return `<article class="project project-card">${image}<span class="eyebrow">PROJETO</span><h2>${h(p.titulo)}</h2><p>${h(p.descricao||'')}</p>${link}</article>`;
    }).join('');
  };

  if(!configured){
    renderProjects(fallbackProjects);
    status.textContent='Configure o Supabase para carregar os projetos diretamente do banco.';
    return;
  }

  try{
    const rows=await api('projetos',{query:'?select=id,titulo,descricao,link,imagem,criado_em&order=id.asc'});
    if(rows && rows.length){
      renderProjects(rows);
      status.textContent=`${rows.length} projeto(s) carregado(s) do Supabase.`;
    }else{
      renderProjects(fallbackProjects);
      status.textContent='A tabela projetos está vazia. Exibindo os projetos do portfólio.';
    }
  }catch(err){
    console.error('Supabase projetos:',err);
    renderProjects(fallbackProjects);
    status.textContent='Não foi possível consultar o Supabase agora. Os projetos continuam visíveis no portfólio.';
  }
}

async function admin(){main.innerHTML=header('ÁREA PESSOAL','Editar meu portfólio.','Cadastre e gerencie os projetos salvos no Supabase.')+'<div id="editor"></div>';const area=document.querySelector('#editor');if(!configured){area.innerHTML='<div class="empty"><h2>Supabase ainda não configurado</h2><p>Confira a configuração do Supabase neste arquivo.</p></div>';return}const user=await currentUser();if(!user){area.innerHTML='<form id="login" class="form"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Entrar</button><p id="status" role="status"></p></form>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await login(f.get('email'),f.get('password'));admin()}catch(err){setStatus(err.message,true)}};return}area.innerHTML='<button id="logout" class="text-button">Sair da conta</button><div class="about-grid"><form id="edit" class="form"><input name="id" type="hidden"><label>Título<input name="titulo" minlength="2" maxlength="120" required></label><label>Descrição<textarea name="descricao" minlength="2" maxlength="1000" required></textarea></label><label>Link do projeto<input name="link" type="url" placeholder="https://"></label><label>Imagem (opcional)<input name="imagem" type="text" placeholder="assets/projeto.jpg"></label><button class="button">Salvar projeto</button><button class="text-button" type="reset">Limpar formulário</button><p id="status" role="status"></p></form><div id="list"></div></div>';document.querySelector('#logout').onclick=()=>{session=null;localStorage.removeItem(sessionKey);admin()};document.querySelector('#edit').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const id=f.get('id');const body={titulo:f.get('titulo'),descricao:f.get('descricao'),link:f.get('link')||'#',imagem:f.get('imagem')||null};try{await api('projetos',{method:id?'PATCH':'POST',query:id?'?id=eq.'+encodeURIComponent(id):'',auth:true,body});e.target.reset();setStatus('Projeto salvo com sucesso.');list()}catch(err){setStatus(err.message,true)}};list()}
async function list(){try{const rows=await api('projetos',{query:'?select=*&order=id.asc',auth:true});document.querySelector('#list').innerHTML=rows.map(p=>`<article class="project"><h2>${h(p.titulo)}</h2><p>${h(p.descricao||'')}</p><button class="text-button" data-edit="${p.id}">Editar</button> <button class="text-button" data-delete="${p.id}">Excluir</button></article>`).join('')||'<p>Nenhum projeto cadastrado.</p>';document.querySelector('#list').onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;if(e.target.dataset.edit){const p=rows.find(p=>String(p.id)===id);const f=document.querySelector('#edit');f.elements.id.value=p.id;f.elements.titulo.value=p.titulo||'';f.elements.descricao.value=p.descricao||'';f.elements.link.value=p.link||'';f.elements.imagem.value=p.imagem||'';f.elements.titulo.focus()}else if(confirm('Excluir este projeto?')){try{await api('projetos',{method:'DELETE',query:'?id=eq.'+encodeURIComponent(id),auth:true});list()}catch(err){setStatus(err.message,true)}}}}catch(err){setStatus(err.message,true)}}
function route(){const path=location.hash||'#/';document.querySelectorAll('[data-nav]').forEach(a=>{if(a.getAttribute('href')===path)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});({ '#/':home,'#/sobre':about,'#/portfolio':portfolio,'#/restaurante':restaurant,'#/maria-bonita':mariaBonita,'#/trivia':trivia,'#/admin':admin}[path]||home)();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script></body></html>
